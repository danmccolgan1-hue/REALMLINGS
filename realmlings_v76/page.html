<title>Realmlings World Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one full-bleed map canvas; chunky comic-style control chips float over the sea at the corners. */
:root {
  --sea: #2b7fc4;
  --sea-deep: #1d5f9e;
  --ink: #1d1a22;
  --chip: #fbfdff;
  --chip-text: #1d1a22;
  --muted: #5a6475;
  --sun: #ffc93c;
  --sun-dark: #e8a817;
  --good: #3e9b4f;
  --bad: #d64545;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-ui: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sea); color: var(--chip-text); font-family: var(--font-ui); overflow: hidden; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }

.chip {
  background: var(--chip); color: var(--chip-text);
  border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink);
}
.hud { position: fixed; z-index: 5; display: flex; gap: 10px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.top { top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; align-items: flex-start; justify-content: space-between; }
.brand { padding: 6px 14px 8px; display: flex; flex-direction: column; line-height: 1; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: 0.5px; color: var(--sun); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
.brand span { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }

.controls { padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls label.seed { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
.controls input[type=text] { font: 600 14px var(--font-ui); width: 140px; padding: 4px 8px; border: 2px solid var(--ink); border-radius: 9px; background: #fff; color: var(--chip-text); }
button { font: 800 14px var(--font-ui); border: 2.5px solid var(--ink); border-radius: 10px; padding: 4px 12px; background: #fff; color: var(--chip-text); cursor: pointer; box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
button.primary { background: var(--sun); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--sun-dark); outline-offset: 2px; }
.toggle { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; cursor: pointer; user-select: none; }
.toggle input { width: 16px; height: 16px; accent-color: var(--sun-dark); }

.bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); justify-content: space-between; align-items: flex-end; flex-wrap: wrap-reverse; }
details.chip { padding: 6px 12px 8px; max-width: min(340px, 100%); min-width: 0; max-height: calc(100vh - 220px); overflow-y: auto; }
details.chip summary { font-family: var(--font-display); font-size: 17px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.chip summary::-webkit-details-marker { display: none; }
details.chip summary::after { content: "▾"; font-family: var(--font-ui); font-size: 14px; margin-left: auto; transition: transform .15s; }
details.chip:not([open]) summary::after { transform: rotate(-90deg); }
.badge { font: 800 12px var(--font-ui); background: var(--good); color: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; }
.badge.bad { background: var(--bad); }

.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; margin-top: 6px; font-size: 13px; font-weight: 600; }
.legend h3 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.legend div { display: flex; align-items: center; gap: 7px; }
.sw { width: 18px; height: 14px; border: 2px solid var(--ink); border-radius: 4px; flex: none; }
.legend img { width: 22px; height: 22px; flex: none; }

.rules { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.rules li { display: grid; grid-template-columns: 20px 1fr; gap: 4px; align-items: start; }
.rules li b { font-weight: 700; }
.rules li small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.mark { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: var(--good); margin-top: 2px; }
.mark.bad { background: var(--bad); }

.zoom { position: fixed; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 92px); display: flex; flex-direction: column; gap: 8px; }
.zoom button { width: 40px; height: 40px; padding: 0; font-size: 20px; line-height: 1; }

#tip { position: fixed; z-index: 6; pointer-events: none; padding: 6px 10px 7px; font-size: 13px; line-height: 1.25; max-width: 240px; transform: translate(14px, 14px); }
#tip strong { font-family: var(--font-display); font-weight: 400; font-size: 16px; display: block; }
#tip .terr { display: inline-block; padding: 0 7px; border-radius: 999px; border: 2px solid var(--ink); font-weight: 800; font-size: 12px; margin: 2px 0 3px; }
#tip .row { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }

#busy { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; }
#busy div { font-family: var(--font-display); font-size: 22px; padding: 10px 18px; }

@media (max-width: 640px) {
  .brand h1 { font-size: 24px; }
  .controls input[type=text] { width: 110px; }
  .zoom { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); }
}
</style>

<canvas id="map" aria-label="Generated island map of 200 provinces"></canvas>

<div class="hud top">
  <div class="brand chip"><h1>Realmlings</h1><span>World generator · 200 provinces</span></div>
  <div class="controls chip">
    <label class="seed" for="seed">Seed <input id="seed" type="text" value="realmlings" spellcheck="false" autocomplete="off"></label>
    <button id="build" type="button">Build</button>
    <button id="reroll" class="primary" type="button">New world</button>
    <label class="toggle" for="optPass"><input id="optPass" type="checkbox"> Passages</label>
    <label class="toggle" for="optIds"><input id="optIds" type="checkbox"> Numbers</label>
  </div>
</div>

<div class="hud bottom">
  <details class="chip" id="legendBox" open>
    <summary>Legend</summary>
    <div class="legend" id="legend"></div>
  </details>
  <details class="chip" id="rulesBox" open>
    <summary>World rules <span class="badge" id="rulesBadge">…</span></summary>
    <ul class="rules" id="rules"></ul>
  </details>
</div>

<div class="zoom">
  <button id="zin" type="button" aria-label="Zoom in">+</button>
  <button id="zout" type="button" aria-label="Zoom out">−</button>
  <button id="zfit" type="button" aria-label="Fit island" style="font-size:15px">⤢</button>
</div>

<div id="tip" class="chip" hidden></div>
<div id="busy" hidden><div class="chip">Raising the island…</div></div>

    for (const cl of G.clouds) {
      const x = bx0 - 1200 + ((cl.x - bx0 + 1200 + (reduceMotion ? 0 : t * cl.v * 5)) % span + span) % span, y = cl.y, s = cl.s * 5.6;
      const puffs = [[0, 0, 22], [-24, 6, 15], [24, 6, 16], [-10, -10, 15], [12, -12, 17]].map(([a, b, r]) => [x + a * s, y + b * s, r * s]);
      g.globalAlpha = ca * 0.18; g.fillStyle = '#0d3050';

      g.globalAlpha = ca; blobUnion(g, puffs, '#ffffff', 5 * s);

}
let pending = false;
function kick() { if (reduceMotion && G && !pending) { pending = true; requestAnimationFrame(n => { pending = false; frame(n); }); } }

// ---------- interaction ----------
const opts = { passages: false, labels: false };
const pointers = new Map(); let dragMoved = 0, pinch = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); dragMoved = 0; if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: cam.z }; } cv.classList.add('dragging'); });
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) {
    const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 1) { cam.x -= (e.clientX - prev[0]) / cam.z; cam.y -= (e.clientY - prev[1]) / cam.z; dragMoved += Math.abs(e.clientX - prev[0]) + Math.abs(e.clientY - prev[1]); }
    else if (pinch) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pinch.z * d / pinch.d / cam.z); dragMoved = 99; }
    cacheDirty = true; clampCam(); kick();
    if (dragMoved > 4) setHover(null);
  } else if (e.pointerType === 'mouse') pickAt(e.clientX, e.clientY);
});
const endPtr = e => {
  if (pointers.has(e.pointerId) && dragMoved < 5 && pointers.size === 1) pickAt(e.clientX, e.clientY, true);
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) cv.classList.remove('dragging');
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !pointers.size) setHover(null); });
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
function zoomAt(sx, sy, f) {
  const [wx, wy] = toWorld(sx, sy);
  cam.z = Math.max(fitZ * 0.6, Math.min(3, cam.z * f));
  cam.x = wx - (sx - cw / 2) / cam.z; cam.y = wy - (sy - ch / 2) / cam.z;
  clampCam(); cacheDirty = true; kick();
}
function clampCam() { const [x0, y0, x1, y1] = G.bounds; cam.x = Math.max(x0 - 850, Math.min(x1 + 850, cam.x)); cam.y = Math.max(y0 - 850, Math.min(y1 + 850, cam.y)); }
$('#zin').onclick = () => zoomAt(cw / 2, ch / 2, 1.4);
$('#zout').onclick = () => zoomAt(cw / 2, ch / 2, 1 / 1.4);
$('#zfit').onclick = () => fit();

const tip = $('#tip');
function pickAt(sx, sy, tap) {
  const [x, y] = toWorld(sx, sy);
  const p = G.provs.find(q => inPoly(x, y, q.pts)) || null;
  setHover(p);
  if (p) {
    const t = TER[p.terrain];
    tip.innerHTML = `<strong>Province ${p.id}</strong><span class="terr" style="background:${t.base}">${t.label}</span>` +
      `<div class="row">${p.sides} sides · ${p.borders} borders</div>` +
      `<div class="row">${p.borders - p.bars} open · ${p.bars} blocked${p.coastal ? ' · coastal' : ''}${p.lakeside ? ' · lakeside' : ''}</div>`;
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(sx, cw - tw - 30) + 'px'; tip.style.top = Math.min(sy, ch - th - 30) + 'px';
  } else tip.hidden = true;
}
function setHover(p) { if (p !== hover) { hover = p; hoverT = performance.now() / 1000; kick(); } if (!p) tip.hidden = true; }

$('#optPass').onchange = e => { opts.passages = e.target.checked; cacheDirty = true; kick(); };
$('#optIds').onchange = e => { opts.labels = e.target.checked; kick(); };

// ---------- panels ----------
function renderPanels(w) {
  const counts = {}; w.provinces.forEach(p => counts[p.terrain] = (counts[p.terrain] || 0) + 1);
  const bc = { trees: 0, mountains: 0, river: 0, ruins: 0 }; w.edges.forEach(e => { if (!e.open) bc[e.style]++; });
  const leg = $('#legend');
  leg.innerHTML = '<h3>Provinces</h3>' + Object.entries(TER).map(([k, t]) => `<div><span class="sw" style="background:${t.base}"></span>${t.label} <span style="color:var(--muted)">${counts[k] || 0}</span></div>`).join('') +
    '<h3>Impassable borders</h3>' +
    [['tree1', 'Trees', bc.trees], ['cypress0', 'Cypress (by swamps)', null], ['mtn0', 'Mountains', bc.mountains], ['river', 'Rivers', bc.river], ['arch', 'Ancient ruins', bc.ruins]].map(([s, l, n]) =>
      `<div>${s === 'river' ? '<span class="sw" style="background:#45a8e4;height:8px;border-radius:6px"></span>' : `<img alt="" src="${spriteURL(s, 22)}">`}${l} <span style="color:var(--muted)">${n === null ? '' : n}</span></div>`).join('') +
    `<div><span class="sw" style="background:#3d97d4"></span>Lakes <span style="color:var(--muted)">${(w.lakes || []).length}</span></div>` +
    `<div><img alt="" src="${stoneURL()}">Open border <span style="color:var(--muted)">${w.edges.filter(e => e.open).length}</span></div>`;
  const ok = w.report.every(r => r.pass);
  $('#rulesBadge').textContent = ok ? 'all ' + w.report.length + ' pass' : w.report.filter(r => !r.pass).length + ' failing';
  $('#rulesBadge').classList.toggle('bad', !ok);
  $('#rules').innerHTML = w.report.map(r => `<li><span class="mark${r.pass ? '' : ' bad'}">${r.pass ? '✓' : '✗'}</span><div><b>${r.label}</b><small>${r.detail}</small></div></li>`).join('');
}
function stoneURL() {
  const c = document.createElement('canvas'); c.width = c.height = 66; const g = c.getContext('2d'); g.scale(3, 3);
  g.fillStyle = WILDS; g.fillRect(9, 0, 4, 22); g.fillStyle = TER.grassland.base; g.fillRect(0, 2, 9, 18); g.fillStyle = TER.forest.base; g.fillRect(13, 2, 9, 18);
  g.fillStyle = '#c9a46a'; g.strokeStyle = OL; g.lineWidth = 1;
  for (const y of [7, 15]) { g.beginPath(); g.ellipse(11, y, 2.4, 3.2, 0, 0, 7); g.fill(); g.stroke(); }
  return c.toDataURL();
}

// ---------- build ----------
const words1 = ['mossy', 'grumpy', 'sunny', 'crooked', 'sleepy', 'golden', 'misty', 'rowdy', 'tiny', 'brave', 'soggy', 'lucky'];
const words2 = ['otter', 'goblin', 'teapot', 'turnip', 'griffin', 'badger', 'wizard', 'acorn', 'kobold', 'beetle', 'troll', 'pixie'];
function build(seed) {
  $('#busy').hidden = false;
  setTimeout(() => {
    try {
      world = RealmGen.generateWorld(seed);
      G = prep(world);
      hover = null; tip.hidden = true;
      bakedScale = 0;
      renderPanels(world);
      fit();
    } catch (err) {
      $('#rulesBadge').textContent = 'error'; $('#rules').innerHTML = `<li><span class="mark bad">✗</span><div><b>That seed did not produce a world</b><small>${err.message}. Try another seed.</small></div></li>`;
    }
    $('#busy').hidden = true;
  }, 30);
}
$('#build').onclick = () => build($('#seed').value.trim() || 'realmlings');
$('#seed').addEventListener('keydown', e => { if (e.key === 'Enter') $('#build').click(); });
$('#reroll').onclick = () => {
  const s = words1[Math.floor(Math.random() * 12)] + '-' + words2[Math.floor(Math.random() * 12)] + '-' + Math.floor(Math.random() * 90 + 10);
  $('#seed').value = s; build(s);
};
if (window.innerWidth < 640) { $('#legendBox').open = false; $('#rulesBox').open = false; }
window.addEventListener('resize', () => { resize(); if (G) clampCam(); });
resize();
world = RealmGen.generateWorld('realmlings'); G = prep(world); renderPanels(world); fit();
if (document.fonts) document.fonts.ready.then(() => { cacheDirty = true; kick(); });
requestAnimationFrame(frame);
})();
</script>
