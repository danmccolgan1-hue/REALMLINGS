<canvas id="c" width="1920" height="1080"></canvas>
<script>

const ox = (MAPW - (x1 - x0) * sc) / 2 - x0 * sc, oy = (H - (y1 - y0) * sc) / 2 - y0 * sc + 18;
const P = (x, y) => [x * sc + ox, y * sc + oy];

// static layer: sea, terrain, lakes, closed borders
const st = document.createElement('canvas'); st.width = W; st.height = H; const s = st.getContext('2d');
{
  const gr = s.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#6f9fb8'); gr.addColorStop(1, '#5a8aa5'); s.fillStyle = gr; s.fillRect(0, 0, MAPW, H);

// hatch patterns for occupation

// ---------- events: which get a callout, and where ----------
const KIND = {
  elim: { tag: 'ANNEXED', pri: 5, col: '#b3261e' }, desert: { tag: 'ARMY DESERTS', pri: 5, col: '#b3261e' }, exhaust: { tag: 'ARMY EXHAUSTION', pri: 4, col: '#d9822b' },

  phase: { tag: 'STRATEGY SHIFT', pri: 2, col: '#4b5563' }, risen: { tag: 'RISEN DEAD', pri: 3, col: '#6250d6' }, magic: { tag: 'MAGIC', pri: 2, col: '#7a55c9' }, spell: { tag: 'SPELL PAYOUT', pri: 1, col: '#7a55c9' }

const nm = id => NAT[id - 1].name;

// keep the interesting ones
const tFrame = t => Math.round(t / 0.8);
const EV = D.events.filter(e => {

{ const last = {}; for (const e of EV) if (e.kind === 'battle') { const k = e.prov; if (last[k] !== undefined && e.f - last[k] < 50) e.skip = true; else last[k] = e.f; } }

const FEED = EV.filter(e => !e.skip && KIND[e.kind].pri >= 2);

// ---------- drawing ----------
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  if (stage === 2) { g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 4.5 : 10, a = i / 10 * Math.PI * 2 - Math.PI / 2; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); g.fillStyle = '#fff6d6'; g.fill(); g.stroke(); g.fillStyle = col; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }

}
function drawFrame(i, quiet) {

  g.drawImage(st, 0, 0);

    const [ax, ay] = V[va], [bx, by] = V[vb];
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.lineCap = 'round'; g.strokeStyle = 'rgba(25,20,15,0.75)'; g.lineWidth = 2.6; g.stroke();
  }

  // settlements
  for (let p = 0; p < NP; p++) if (own[p]) settlement(site[p][0], site[p][1], stg[p], natCol(own[p]));
  // battles
  for (const p of R.bat) { const [x, y] = site[p]; const k = 0.75 + 0.25 * Math.sin(i / 3 + p); g.beginPath(); g.arc(x, y - 4, 17 * k, 0, 7); g.fillStyle = 'rgba(255,200,60,0.45)'; g.fill(); swords(x, y - 4, 1.05, 1); }
  // alliances: a dashed gold line between the two capitals
  for (const [a, b] of (R.al || [])) {
    const ca = capOf(own, stg, a), cb = capOf(own, stg, b); if (ca < 0 || cb < 0) continue;
    const [x1, y1] = site[ca], [x2, y2] = site[cb];
    g.save(); g.lineCap = 'round'; g.setLineDash([10, 7]); g.lineDashOffset = -i * 0.6;
    g.strokeStyle = 'rgba(25,20,10,0.55)'; g.lineWidth = 6; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = '#ffd34d'; g.lineWidth = 3; g.stroke(); g.restore();

    g.beginPath(); g.arc(mx, my, 11, 0, 7); g.fillStyle = '#ffd34d'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#1d1a16'; g.stroke();
    g.lineWidth = 2; g.beginPath(); g.ellipse(mx - 3, my, 4.5, 3, 0, 0, 7); g.stroke(); g.beginPath(); g.ellipse(mx + 3, my, 4.5, 3, 0, 0, 7); g.stroke();

    g.font = `700 15px ${FONT}`; g.fillStyle = '#1d1a16'; fitText(c.title, c.bx + 16, c.by + 39, BW - 26);
    g.font = `500 12.5px ${FONT}`; g.fillStyle = '#57534e'; fitText(c.detail, c.bx + 16, c.by + 57, BW - 26);

}
function capOf(own, stg, id) { for (let p = 0; p < NP; p++) if (own[p] === id && stg[p] === 2) return p; for (let p = 0; p < NP; p++) if (own[p] === id) return p; return -1; }

function drawHud(i, R) {

  g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.font = `800 17px ${FONT}`; g.fillText('REALMLINGS', 30, 34);
  g.font = `500 15px ${FONT}`; g.fillStyle = '#c9cdd6'; g.fillText('8 AI nations · mock game · all provinces visible', 148, 34);
  // clock

  g.fillStyle = '#fff'; g.font = `800 21px ${FONT}`; g.textAlign = 'left'; g.fillText(fmt(R.t), MAPW - 236, 35);
  g.font = `600 12px ${FONT}`; g.fillStyle = '#c9cdd6'; g.textAlign = 'right'; g.fillText('of 60:00 · 24× speed', MAPW - 28, 35);
